name: drip
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  drip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Release next batch
        run: |
          git config user.name "Tohraan Ahmad Khan"
          git config user.email "129254281+tohraan@users.noreply.github.com"
          python tools/drip.py
      - run: pytest -q
      - run: git push
